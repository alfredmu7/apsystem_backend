############################################
# APP INFO
############################################
spring.application.name=ApSystem
server.port=8080

############################################
# DATABASE - CONFIGURACIÓN LIMPIA PARA NEON
############################################
# 1. La URL debe ser solo el protocolo, el host y la base de datos.
# Eliminamos el 'user:pass@' y el 'channel_binding' de aquí.
spring.datasource.url=jdbc:postgresql://ep-soft-frog-ad7jzau4-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require

# 2. Las credenciales se manejan aquí (IntelliJ usará tus Environment Variables)
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_1dfDJ9bExQhe}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto y JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

############################################
# JWT CONFIG
############################################
jwt.secret=${JWT_SECRET:APsystemSuperSecretKey123456789!}
jwt.expiration-ms=3600000

############################################
# CORS
############################################
frontend.url=${FRONTEND_URL:http://localhost:5173}

############################################
# FILE UPLOADS
############################################
file.upload-dir=img_uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

############################################
# LOGGING
############################################
logging.level.org.springframework.security=INFO
logging.level.com.example.ApSystem=DEBUG