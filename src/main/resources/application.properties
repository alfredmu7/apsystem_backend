############################################
# APP INFO
############################################
spring.application.name=ApSystem

# Puerto del servidor
server.port=8080


############################################
# DATABASE ? H2 (Modo memoria para desarrollo)
############################################
spring.datasource.url=jdbc:h2:mem:apsystem_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola de H2

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


############################################
# JWT CONFIG
############################################
# Clave secreta (cámbiala por una mucho más larga en producción)
jwt.secret=APsystemSuperSecretKey123456789!

# Tiempo de expiración del token (1h = 3600000 ms)
jwt.expiration-ms=3600000



############################################
# CORS ? habilita el acceso desde tu frontend React
############################################
# Cambia esta URL al puerto donde corre tu React
frontend.url=http://localhost:5173


############################################
# FILE UPLOADS
############################################
# Carpeta local donde se guardarán imágenes/archivos
file.upload-dir=img_uploads

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


############################################
# LOGGING
############################################
logging.level.org.springframework.security=INFO
logging.level.com.apsystem=DEBUG
