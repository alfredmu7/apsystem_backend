############################################
# APP INFO
############################################
spring.application.name=ApSystem
server.port=8080

############################################
# DATABASE - CONFIGURACIÓN LIMPIA PARA NEON
############################################
# Se mantiene tu URL pero añadimos tcpKeepAlive para evitar cortes de red
spring.datasource.url=jdbc:postgresql://ep-soft-frog-ad7jzau4-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&tcpKeepAlive=true

# Credenciales
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_1dfDJ9bExQhe}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- AJUSTES DE HIKARI (CORRECCIÓN DE ERROR 500 / CONNECTION CLOSED) ---
# Tiempo máximo que una conexión puede estar inactiva (10 min)
spring.datasource.hikari.idle-timeout=600000
# Tiempo máximo de vida (30 min). Neon suele cerrar conexiones a la hora.
spring.datasource.hikari.max-lifetime=1800000
# Validación rápida antes de usar la conexión
spring.datasource.hikari.connection-test-query=SELECT 1
# Tiempo de espera para obtener conexión del pool (30 seg)
spring.datasource.hikari.connection-timeout=30000

# Dialecto y JPA
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Asegura que el script se ejecute DESPUÉS de que Hibernate valide
spring.jpa.defer-datasource-initialization=true

############################################
# JWT CONFIG
############################################
jwt.secret=${JWT_SECRET:APsystemSuperSecretKey123456789!}
jwt.expiration-ms=3600000

############################################
# CORS
############################################
frontend.url=${FRONTEND_URL:http://localhost:5173}

############################################
# FILE UPLOADS
############################################
file.upload-dir=img_uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

############################################
# LOGGING
############################################
logging.level.org.springframework.security=INFO
logging.level.com.example.ApSystem=DEBUG